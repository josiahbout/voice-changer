<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoicePlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 6h10a5 5 0 0 1 4.9 6l-.8 4a3 3 0 0 1-5.2 1.4L14 15.5h-4l-1.9 1.9A3 3 0 0 1 2.9 16l-.8-4A5 5 0 0 1 7 6Zm0 3.2v1.3H5.7v1.6H7v1.3h1.6v-1.3h1.3v-1.6H8.6V9.2H7Zm9.5.1a1 1 0 1 0 0 2 1 1 0 0 0 0-2Zm-1.8 2.2a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z"/>
        </svg>
        <div class="brand-name">VoicePlay</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="settings-btn" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        </button>
        <!-- Window controls; not wired up yet -->
        <div class="window-controls">
          <button class="win-btn" id="win-min" aria-label="Minimize">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9"/></svg>
          </button>
          <button class="win-btn" id="win-max" aria-label="Expand">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 3h3.5v3.5M13 3 9 7M6.5 13H3V9.5M3 13l4-4"/></svg>
          </button>
          <button class="win-btn win-close" id="win-close" aria-label="Exit">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
          </button>
        </div>
      </div>
    </header>

    <section class="intro">
      <h1>Choose Your Voice</h1>
    </section>

    <section class="voices" id="voices" role="radiogroup" aria-label="Voices"></section>

    <section class="talk-bar">
      <button class="bar-btn" id="tune-btn" aria-label="Voice settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6.5h16M4 12h16M4 17.5h16"/>
          <circle cx="9" cy="6.5" r="2.6"/><circle cx="15.5" cy="12" r="2.6"/><circle cx="10.5" cy="17.5" r="2.6"/>
        </svg>
      </button>
      <button class="mic" id="mic-btn" aria-pressed="false" aria-label="Tap to talk">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>
      </button>
      <button class="bar-btn" id="listen-btn" aria-label="Hear yourself">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="line" d="M7 9.5a5.5 5.5 0 0 1 11 0c0 3.2-2.6 4.3-3.4 6.3-.6 1.6-.8 2.7-1.6 3.6a2.6 2.6 0 0 1-4.3-1"/>
          <path class="line" d="M10 9.8a2.6 2.6 0 0 1 5.1-.6c.3 1.3-.6 2-1.4 2.6"/>
        </svg>
      </button>
    </section>
  </main>

  <script src="cable.js"></script>
  <script src="app.js"></script>
</body>
</html>
